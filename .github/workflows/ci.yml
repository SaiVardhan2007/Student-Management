name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci
      - run: npm run test:coverage

  client:
    name: Client tests & build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: client }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix server audit --omit=dev --audit-level=high
      - run: npm --prefix client audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end & accessibility
    runs-on: ubuntu-latest
    needs: [server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm --prefix server ci
      - run: npm --prefix client ci
      - run: npm --prefix e2e ci
      - run: npx --prefix e2e playwright install --with-deps chromium
      - run: npm --prefix client run build
      - run: npm run smoke
      - run: npm --prefix e2e test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint, server, client]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: student-management-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker network create smoke
          docker run -d --name mongo --network smoke mongo:7
          docker run -d --name app --network smoke -p 5000:5000 \
            -e MONGODB_URI=mongodb://mongo:27017/smoke \
            -e JWT_SECRET=$(openssl rand -hex 32) -e JWT_REFRESH_SECRET=$(openssl rand -hex 32) \
            student-management-system:ci
          for i in $(seq 1 30); do curl -fs localhost:5000/api/ready && break || sleep 2; done
          curl -fs localhost:5000/ | grep -q "Student Management System"
