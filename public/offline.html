<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2563eb">
<title>Offline</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f8fafc;color:#0f172a;padding:16px}
  .card{max-width:360px;text-align:center}
  img{width:64px;height:64px;border-radius:14px}
  button{margin-top:16px;padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
  @media (prefers-color-scheme:dark){body{background:#0f172a;color:#e2e8f0}}
</style>
</head>
<body>
<div class="card">
  <img src="/icon-192.png" alt="">
  <h1 style="font-size:20px">You're offline</h1>
  <p>Check your internet connection. The app will work again as soon as you're back online.</p>
  <button onclick="location.reload()">Try again</button>
</div>
</body>
</html>
